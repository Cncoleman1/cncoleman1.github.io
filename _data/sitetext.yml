en: &DEFAULT_EN
  header:
    title: Welcome to my personal website!
    text: 
    button: About Me
    buttonlink: "#services"

  services:
    title: "About Me"
    text: "I am a 3rd year PhD Candidate in the Microbiology and Molecular Genetics (MMG) program at Emory University. After 1 year of laboratory rotations, I joined Dr. Rafael Medina's lab in the Department of Pathology and Laboratory Medicine."
    image: assets/img/SEA-PHAGES-Lab-Coat-Grad-Photo.jpg
    section: services
    list:
      - title: "Research"
        desc: "I study the impact of surrounding gases in air (particulary ammonia) on the ability of influenza A virus to spread"
        icon: fas fa-book-open #find more at https://fontawesome.com/icons
      - title: "Teaching"
        desc: "I serve as a teaching assistant for the undergraduate Microbiology lecture."
        icon: fas fa-chalkboard-teacher
      - title: "Outreach"
        desc: "I volunteer through Emory student organizations both for science and non-science related causes"
        icon: fas fa-users

  portfolio:
    title: "Portfolio"
    text: "Read more about all the components of my PhD and what led me to graduate school"
    section: portfolio
    closebutton: "Close Project"

  timeline:
    title: "My Journey"
    text: "Follow my progression as a scientist from high school to graduate school"
    section: timeline
    # left is the default
    #start_align: "left"
    events:
      - title: "Biotech Track-ISTEM at Countryside High School"
        year: "May 2019"
        desc: "Through Countryside High School's Institute for Science Technology Engineering and Math (ISTEM) program, I earned my Biotechnician Assistant credentials and gained introductory laboratory skills. I performed my first independent science project which won first place at the Pinellas County regional science fair and proceeded to the State level."
        image: assets/img/timeline/STEM-Academy-Photo-200.jpg
        alt:
      - title: "Where it All Started"
        year: "July 2019"
        desc: "I was accepted into the 2023 USF STEM Academy run by Dr. Richard Pollenz. This was a 2 week program that took place prior to my first semester as an undergraduate student."
        image: assets/img/timeline/STEM-Academy-Photo-200.jpg
        alt:
      - title: "SEA-PHAGES/SEA-GENES"
        year: "August 2019-August 2022"
        desc: "I was selected as one of 32 students in the 2019 SEA-PHAGES Cohort. I continued to work with Dr. Richard Pollenz first at a teaching assistant for SEA-PHAGES, then again as a student in the 2022 SEA-GENES Cohort. Phage-Hunters Advancing Genomics and Evolutionary Science (PHAGES) and Gene Exploration by a Network ofo Emerging Scientists (GENES) Are both Science Education Alliance (SEA) programs funded by the Howard Hughes Medical Institute (HHMI) and National Science Foundation (NSF)."
        image: assets/img/timeline/SEA-PHAGES-Lab-Coat-Grad-Photo-200.jpg
        alt:
      - title: "Summer REUs"
        year: "Summer 2021, Summer 2022"
        desc: "I spent 8 weeks conducting research at Cornell University in Ithaca, New York under the mentorship of Dr. Cedric Feschottte, working closely with Dr. Wells on my first computational project exploring the coevolution of transposable elements and zinc finger genes. At the University of Georgia, in Athens, Georgia I performed  microbial source tracking associated with *Salmonella* in 
four distinct creek systems."
        image: assets/img/timeline/UGA-REU-Photo-Group-200.jpg
        alt: image alt text
      - title: "Title"
        year: "Summer 2023-Summer 2024 Gap Year: STEM Specialist/Residential Counselor"
        desc: "I worked in the Summer of 2023 as a residential counselor at Barnard College in New York City, New York and in 2024 at the University of Pennsylvania in Philadelphia, Pennsylvania. I lead group workshops such as 'Science in your Life', planned social events and chaperoned excurisions to explore both cities. As a STEM specialist, I leveraged my background in Microbiology to expand STEM activities for preschoolers at Amazing Explorers Academy." 
        image: assets/img/timeline/RC-Caitlyn-200.jpg
        alt:
        # you can enforce the alignment
        align: right
    end: "3rd Year <br> Emory MMG  <br> PhD Program"

